version: "3.8"

services:
  server:
    build:
      context: ./server
    container_name: intelligenticai-server
    ports:
      - "4000:4000"
    networks:
      - app-network

  frontend:
    build:
      context: ./intelligenticai-website
    container_name: intelligenticai-website
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://server:4000
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
